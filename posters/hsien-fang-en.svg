<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1086" height="1448" viewBox="0 0 1086 1448">
  <style id="fonts">@import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&amp;family=Cormorant+Garamond:wght@700&amp;display=swap');</style>
  <style>
    text { font-family: 'Nunito Sans', sans-serif; fill: #3b2314; }
    .accent { fill: #d9821f; }
    .muted { fill: #6b5a4e; }
    .serif { font-family: 'Cormorant Garamond', serif; }
  </style>
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fffaf4" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fffaf4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fffaf4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1086" height="1448" fill="#fffaf4"/>

  <!-- Portrait (photo area of the original flyer) -->
  <svg x="360" y="0" width="726" height="600" viewBox="568 0 518 428" preserveAspectRatio="xMidYMid slice">
    <image href="../images/flyer-hsien-fang.jpg" x="0" y="0" width="1086" height="1448"/>
  </svg>
  <rect x="360" y="0" width="360" height="600" fill="url(#fade)"/>
  <path d="M0,566 C300,520 700,650 1086,548 L1086,620 L0,620 Z" fill="#fffaf4"/>
  <path d="M0,566 C300,520 700,650 1086,548" fill="none" stroke="#ffaf53" stroke-width="4"/>

  <!-- Heading block -->
  <text x="64" y="118" font-size="40" font-weight="800" class="accent">A Zen Acupuncturist</text>
  <text x="64" y="166" font-size="40" font-weight="800" class="accent">Body &amp; Mind in Balance</text>
  <text x="64" y="282" font-size="72" font-weight="800">Hsien Fang<tspan font-size="40" font-weight="600">, L.Ac.</tspan></text>
  <rect x="64" y="326" width="460" height="56" rx="28" fill="#ffaf53"/>
  <text x="294" y="363" font-size="24" font-weight="700" text-anchor="middle">California Licensed Acupuncturist</text>
  <text x="64" y="444" font-size="26" font-weight="600" class="muted">30 Years of Clinical Experience</text>

  <!-- Intro -->
  <text font-size="22" font-weight="400">
    <tspan x="64" y="664">Hsien Fang, L.Ac., trained in acupuncture and Tui-na at Beijing University</tspan>
    <tspan x="64" y="700">of T.C.M. and completed postgraduate training in kidney disease at Nanjing</tspan>
    <tspan x="64" y="736">University of T.C.M. Over 30 years in Beijing, Nanjing, Taiwan and Los Angeles,</tspan>
    <tspan x="64" y="772">he has combined acupuncture, herbal medicine, Tui-na, Qi Gong and Zen</tspan>
    <tspan x="64" y="808">meditation to treat body and mind together.</tspan>
  </text>

  <!-- Conditions -->
  <rect x="56" y="842" width="8" height="46" rx="2" fill="#ffaf53"/>
  <text x="82" y="878" font-size="36" font-weight="800">Conditions We Treat</text>
  <rect x="34" y="912" width="1018" height="380" rx="22" fill="#ffffff" stroke="#f3e3d1" stroke-width="2"/>
  <line x1="543" y1="940" x2="543" y2="1266" stroke="#f0dcc6" stroke-width="2"/>
  <g fill="#ffaf53">
    <circle cx="72" cy="952" r="6"/><circle cx="72" cy="990" r="6"/><circle cx="72" cy="1028" r="6"/>
    <circle cx="72" cy="1066" r="6"/><circle cx="72" cy="1104" r="6"/><circle cx="72" cy="1142" r="6"/>
    <circle cx="72" cy="1180" r="6"/><circle cx="72" cy="1218" r="6"/><circle cx="72" cy="1256" r="6"/>
    <circle cx="578" cy="952" r="6"/><circle cx="578" cy="990" r="6"/><circle cx="578" cy="1028" r="6"/>
    <circle cx="578" cy="1066" r="6"/><circle cx="578" cy="1104" r="6"/><circle cx="578" cy="1142" r="6"/>
    <circle cx="578" cy="1180" r="6"/>
  </g>
  <text font-size="19" font-weight="600">
    <tspan x="92" y="958">Heart &amp; cerebrovascular disease</tspan>
    <tspan x="92" y="996">High blood pressure</tspan>
    <tspan x="92" y="1034">Liver &amp; kidney disease</tspan>
    <tspan x="92" y="1072">Stroke &amp; hemiplegia</tspan>
    <tspan x="92" y="1110">Infertility</tspan>
    <tspan x="92" y="1148">Menopausal symptoms</tspan>
    <tspan x="92" y="1186">Irregular menstruation</tspan>
    <tspan x="92" y="1224">Neck, shoulder &amp; back pain</tspan>
    <tspan x="92" y="1262">Joint pain</tspan>
    <tspan x="598" y="958">Stomach &amp; abdominal pain</tspan>
    <tspan x="598" y="996">Insomnia &amp; hypersomnia</tspan>
    <tspan x="598" y="1034">Depression</tspan>
    <tspan x="598" y="1072">Schizophrenia</tspan>
    <tspan x="598" y="1110">Autism</tspan>
    <tspan x="598" y="1148">Acne</tspan>
    <tspan x="598" y="1186">Other difficult &amp; complex conditions</tspan>
  </text>

